name: prescript_sense
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  image_picker: ^1.2.1
  shared_preferences: ^2.5.4
  google_mlkit_text_recognition: ^0.15.0
  sqflite: ^2.4.2
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.5
  google_generative_ai: ^0.4.6

  # Packages for Nearby Clinics page
  flutter_map: ^8.2.2
  url_launcher: ^6.3.0
  google_maps_flutter: ^2.3.1
  sqflite_common_ffi: ^2.4.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/image/stethoscope_blue.jpg
    - assets/image/upload_prescription.png
    - assets/image/medicine_checker.png
    - assets/image/text_to_speech.png
    - assets/image/reminder.png
    - assets/image/find_clinic.png
